career-profile:
    title: Career Profile
    summary: |
      Cloud Solutions Consultant with an engineering background and a track record of translating business and operational challenges into credible technology solutions. I combine customer discovery, stakeholder alignment, solution shaping, and hands-on technical expertise to help organisations make better decisions and deliver measurable outcomes.

      My experience spans AWS platform delivery, AI-first engineering, data platforms, and DevOps. Over time I have moved closer to customer-facing and commercially focused work: managing AWS partner relationships, running discovery workshops, securing partner funding, developing propositions, and guiding investment and resourcing decisions. I am now targeting consulting, pre-sales, partner management, and technical business development roles where technical depth strengthens commercial impact.

commercial-impact:
    title: Commercial Impact
    intro: |
      Selected achievements that show how I create value beyond delivery: funding, revenue, account growth, and stakeholder alignment.
    items:
      - title: Secured AWS funding and MAP credits
        detail: As Deputy AWS Partner Lead, managed the AWS relationship and unlocked migration acceleration incentives to support client engagements.

      - title: Generated an extra £2,500/day in billables
        detail: Built a business case that closed a contractor-reliance gap and helped grow the delivery team from 2 to 6 engineers.

      - title: Converted an unfunded engineer into a £750/day billable role
        detail: Negotiated two unfunded engineers onto an understaffed project through internal resourcing and converted one into a permanent billable position.

      - title: Built and pitched an AI proposition
        detail: Developed a Bedrock RAG solution enabling project managers to query project data for risk and trend analysis, then pitched it to senior stakeholders.

      - title: Supported account and partner growth
        detail: Identified opportunities within existing accounts, ran discovery workshops, and worked with the AWS partner team to grow Capgemini's AWS practice.

education:
    title: Education
    info:
      - degree: BSc - Digital & Technology Solutions
        university: Aston University
        time: 2019 - 2024
        details: |
          Completed a part-time BSc degree sponsored by Capgemini, undertaken concurrently with full-time employment.
          Dissertation involved designing and developing an automation solution in Azure to scan platforms for non-compliant resources and automate ticket creation in Azure DevOps.

experiences:
    title: Experiences
    info:
      - role: Senior Platform Engineer
        time: 2026 - Present
        company: Kainos
        details: |
            Worked on a multi-account AWS healthcare data platform, turning regulated data, security, and operational requirements into a credible platform approach. Championed an AI-first consulting and engineering method that improved the speed at which the team could validate solutions and respond to opportunities.
            - Led scoping and options conversations for healthcare data workloads
            - Translated security, operational, and delivery constraints into architecture options across segregated AWS accounts
            - Championed an agentic AI delivery approach internally, validating 130+ requirements and 500+ commits as evidence of the method
            - Improved solution validation speed, strengthening the team's ability to respond to new opportunities

      - role: Deputy AWS Partner Lead
        time: 2025 - 2026 (concurrent)
        company: Capgemini
        details: |
            Helped run Capgemini's AWS relationship, connecting partner capabilities and funding to customer migration and modernisation challenges. Focused on discovery, proposition development, and account engagement.
            - Managed client and AWS relationships, identifying opportunities and positioning Capgemini solutions with clients and partner teams
            - Secured AWS funding and MAP credits to support client migration and modernisation initiatives
            - Developed and pitched a Bedrock RAG proposition enabling project managers to query project data for risk and trend analysis
            - Ran discovery workshops and supported account growth across existing and new clients alongside the AWS partner team

      - role: DevOps Lead
        time: 2025 - 2026
        company: Capgemini
        details: |
            Served as the trusted link between delivery teams and client stakeholders on a retail-sector AWS data platform. Focused on communicating production readiness, managing delivery risk, and building client confidence.
            - Owned release planning and production-readiness decisions across three environments
            - Communicated readiness and risk clearly to senior stakeholders, improving confidence in the platform
            - Identified and removed delivery blockers, enabling the account to take on additional scope

      - role: Technical Architect
        time: 2024 - 2025
        company: Capgemini
        details: |
            Recognised a delivery capacity problem on a data visualisation platform and built alignment around a resourcing solution that created measurable commercial value.
            - Identified the account capacity risk and developed a resourcing approach with internal stakeholders
            - Negotiated two unfunded engineers onto the project; converted one into a permanent billable role adding £750/day
            - Aligned senior client stakeholders and internal teams on solution direction and trade-offs
            - Balanced solution design with account health, delivery capacity, and commercial priorities

      - role: Platform Lead
        time: 2023 - 2024
        company: Capgemini
        details: |
            Led an Azure-hosted data visualisation platform in the health sector, reducing operational complexity through a simpler, lower-risk platform approach and building trust with senior stakeholders.
            - Developed a metadata-driven platform that reduced operational complexity and service risk
            - Presented technical options and trade-offs to senior client stakeholders, building account credibility
            - Ran workshops and scoping conversations that connected technical decisions to business outcomes

      - role: Platform Engineer
        time: 2022 - 2023
        company: Capgemini
        details: |
            Managed the AWS platform for a large government data visualisation solution while identifying a contractor-reliance and capability risk, then securing investment to expand account capability.
            - Identified the contractor-reliance gap and built a business case that secured additional investment
            - Helped grow the delivery team from 2 to 6 engineers, generating an extra £2,500/day in billables
            - Owned the end-to-end AWS platform and acted as team lead during the manager's absence
            - Presented platform health and investment needs clearly to stakeholders

      - role: DevOps Engineer
        time: 2021 - 2022
        company: Capgemini
        details: |
            Delivered bulk data migration services on one of Capgemini's largest AWS accounts, becoming a trusted point of contact for migration releases and stakeholder updates.
            - Deployed and managed AWS Database Migration infrastructure as the release owner
            - Coordinated migration releases with downstream consumers, resolving blockers and keeping stakeholders informed
            - Presented updates to a wider audience, building early customer-facing communication experience

